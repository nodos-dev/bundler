# This is a basic workflow to help you get started with Actions

name: Release Bundle

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: 'Nodos Version'
        required: true
        default: "1.4"
        type: choice
        options:
          - "1.2"
          - "1.3"
          - "1.4"
          - "1.5"
      bundle_keyword:
        description: 'Bundle Keyword'
        required: true
        default: "vs"
        type: string
      bundle_version:
        description: 'Bundle Version'
        required: false
        type: string
      windows:
        description: 'Bundle for Windows'
        required: true
        default: true
        type: boolean
      linux:
        description: 'Bundle for Linux'
        required: true
        default: true
        type: boolean
      macos:
        description: 'Bundle for macOS (Apple Silicon)'
        required: true
        default: true
        type: boolean
      previous_release_version:
        description: 'Previous Release Version (e.g. 1.3-broadcast-v4-b4711)'
        required: false

env:
  GH_USERNAME: "nodos-bot"
  GH_TOKEN: ${{ secrets.CI_TOKEN }}
  GIT_EMAIL: "bot@nodos.dev"
  NODOS_STORE_ACCESS_TOKEN: ${{ secrets.NODOS_STORE_ACCESS_TOKEN }}

# TODO: Support parallel runs
concurrency:
  group: ${{ github.ref_name }} # For now, allow 1 run at a time for each branch
  cancel-in-progress: false # Queue up runs if one is already in progress.

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  set-build-number:
    name: Set Build Number
    runs-on: [self-hosted, bundler]
    outputs:
      build_number: ${{ steps.offset-build-number.outputs.build_number }}
    steps:
      - name: Offset Build Number
        id: offset-build-number
        shell: bash
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 3527 ))
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

  prepare-strategy:
    name: Prepare Strategy
    runs-on: [self-hosted, bundler]
    outputs:
      runner-list: ${{ steps.prepare-step.outputs.runner-list }}
    steps:
      - name: Prepare Runner List
        id: prepare-step
        shell: bash
        run: |
          set -euo pipefail
          # One label set per selected platform. The OS label is the one GitHub
          # gives every runner, so it is the last entry and names the job.
          runner_list="["
          if [ "${{ inputs.windows }}" == "true" ]; then runner_list+='["self-hosted","bundler","Windows"],'; fi
          if [ "${{ inputs.linux }}" == "true" ]; then runner_list+='["self-hosted","bundler","Linux"],'; fi
          if [ "${{ inputs.macos }}" == "true" ]; then runner_list+='["self-hosted","bundler","macOS"],'; fi
          runner_list="${runner_list%,}]"
          if [ "$runner_list" == "[]" ]; then
            echo "No platform selected, so there is nothing to bundle"
            exit 1
          fi
          echo Runners: $runner_list
          echo "runner-list=$runner_list" >> $GITHUB_OUTPUT

  bundle:
    strategy:
      matrix:
        runner: ${{ fromJson(needs.prepare-strategy.outputs.runner-list) }}
      fail-fast: false
    name: Bundle Nodos (${{ github.event.inputs.version }} - ${{ github.event.inputs.bundle_keyword }}) (${{ matrix.runner[2] }})
    permissions:
      contents: write  # Required for creating releases
    env:
        BUILD_NUMBER: ${{ needs.set-build-number.outputs.build_number }}
    runs-on: ${{ matrix.runner }}
    needs: [prepare-strategy, set-build-number]
    steps:
      - name: Setup Environment Variables
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            echo "DIST_TARGET_DIR=${NOS_BUILD_DIR}\\Bundler" >> $GITHUB_ENV
          else
            echo "DIST_TARGET_DIR=${NOS_BUILD_DIR}/Bundler" >> $GITHUB_ENV
          fi
      - name: Update Git Credentials
        continue-on-error: true
        shell: bash
        run: |
          git credential-manager github login --username ${{ env.GH_USERNAME }} --token ${{ env.GH_TOKEN }} --force
      - name: Checkout Repository
        uses: actions/checkout@v2
        with:
          repository: nodos-dev/bundler
          ref: ${{ github.ref }}
          token: ${{ env.GH_TOKEN }}
          path: ./bundler-${{ github.ref_name }}
          fetch-depth: 01
      - name: Install Python Dependencies
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            pip install -r requirements.txt
          else
            # The system Python on Linux and macOS refuses packages outside a venv
            # (PEP 668). The venv also puts a "python" command on the PATH of the
            # steps below, which plain Ubuntu does not have.
            python3 -m venv .venv
            .venv/bin/pip install -r requirements.txt
            echo "$PWD/.venv/bin" >> $GITHUB_PATH
          fi
        working-directory: ./bundler-${{ github.ref_name }}
      - name: Install Nosman
        shell: bash
        run: |
          cargo install nosman
      - name: Bundle Nodos
        id: create_bundle
        run: |
          python ./bundler.py --version="${{ github.event.inputs.version}}" --bundle-key="${{ github.event.inputs.bundle_keyword}}" --bundle-version="${{ github.event.inputs.bundle_version}}" --bundle
        working-directory: ./bundler-${{ github.ref_name }}/
      - name: Create Package
        id: create_package
        run: |
          python ./bundler.py --version="${{ github.event.inputs.version}}" --bundle-key="${{ github.event.inputs.bundle_keyword}}" --bundle-version="${{ github.event.inputs.bundle_version}}" --pack
        working-directory: ./bundler-${{ github.ref_name }}/
      - name: Copy Bundle to Distribution Machine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.DIST_TARGET_DIR }}/${{ needs.set-build-number.outputs.build_number }}"
          copy ./Artifacts/Nodos-* ${{ env.DIST_TARGET_DIR }}/${{ needs.set-build-number.outputs.build_number }}
        working-directory: ./bundler-${{ github.ref_name }}
      - name: Create Release
        id: release_nos_main_repo
        shell: pwsh
        run: |
          python ./bundler.py --version="${{ github.event.inputs.version}}" --bundle-key="${{ github.event.inputs.bundle_keyword}}" --bundle-version="${{ github.event.inputs.bundle_version}}" --gh-release --gh-release-repo="https://github.com/nodos-dev/bundler" --gh-release-target-branch="${{ github.ref_name }}" --gh-release-prev-version="${{ github.event.inputs.previous_release_version }}"
        working-directory: ./bundler-${{ github.ref_name }}/
