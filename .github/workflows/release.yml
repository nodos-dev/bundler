name: Release Bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Nodos Version'
        required: true
        default: "1.5"
        type: choice
        options:
          - "1.4"
          - "1.5"
      bundle_keyword:
        description: 'Bundle Keyword'
        required: true
        default: "vs"
        type: string
      bundle_version:
        description: 'Bundle Version'
        required: false
        type: string
      windows:
        description: 'Publish for Windows'
        required: true
        default: true
        type: boolean
      linux:
        description: 'Publish for Linux'
        required: true
        default: false
        type: boolean
      linux_arm64:
        description: 'Publish for Linux (ARM64)'
        required: true
        default: false
        type: boolean
      macos:
        description: 'Publish for macOS (Apple Silicon)'
        required: true
        default: false
        type: boolean
      previous_release_version:
        description: 'Previous bundle release to compare against (e.g. 1.5.0.b4711)'
        required: false
      first_publish:
        description: 'The bundle is not on the store yet: skip the previous release lookup and write the notes as a first release'
        required: true
        default: false
        type: boolean
      dry_run:
        description: 'Dry run'
        required: true
        default: false
        type: boolean

env:
  NODOS_STORE_ACCESS_TOKEN: ${{ secrets.NODOS_STORE_ACCESS_TOKEN }}

concurrency:
  group: ${{ github.ref_name }} # For now, allow 1 run at a time for each branch
  cancel-in-progress: false # Queue up runs if one is already in progress.

jobs:
  release:
    name: Release Bundle (${{ inputs.version }} - ${{ inputs.bundle_keyword }})
    # A manifest names packages, not files, so one runner publishes every platform.
    runs-on: [self-hosted, bundler, Windows]
    permissions:
      contents: read
    outputs:
      build_number: ${{ steps.build-number.outputs.build_number }}
      matrix: ${{ steps.published.outputs.matrix }}
    steps:
      - name: Set Build Number
        id: build-number
        shell: bash
        run: echo "build_number=$(( ${{ github.run_number }} + 3527 ))" >> $GITHUB_OUTPUT
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: nodos-dev/bundler
          ref: ${{ github.ref }}
          path: ./bundler-${{ github.ref_name }}
          fetch-depth: 01
      - name: Install Python Dependencies
        shell: bash
        run: pip install -r requirements.txt
        working-directory: ./bundler-${{ github.ref_name }}
      - name: Install Nosman
        shell: bash
        # Use the latest published nosman so bundle builds exercise new releases.
        run: cargo install nosman
        working-directory: ./bundler-${{ github.ref_name }}
      - name: Select Platforms
        id: platforms
        shell: bash
        run: |
          set -euo pipefail
          platforms=""
          if [ "${{ inputs.windows }}" == "true" ]; then platforms+="x86_64-windows,"; fi
          if [ "${{ inputs.linux }}" == "true" ]; then platforms+="x86_64-linux,"; fi
          if [ "${{ inputs.linux_arm64 }}" == "true" ]; then platforms+="aarch64-linux,"; fi
          if [ "${{ inputs.macos }}" == "true" ]; then platforms+="aarch64-macos,"; fi
          platforms="${platforms%,}"
          if [ -z "$platforms" ]; then
            echo "No platform selected, so there is nothing to publish"
            exit 1
          fi
          echo "Platforms: $platforms"
          echo "platforms=$platforms" >> $GITHUB_OUTPUT
      - name: Publish Bundle Manifests
        # The free-text inputs reach the shell as environment variables, never
        # spliced into the script, so their contents cannot be run as commands.
        env:
          BUILD_NUMBER: ${{ steps.build-number.outputs.build_number }}
          NODOS_VERSION: ${{ inputs.version }}
          BUNDLE_KEY: ${{ inputs.bundle_keyword }}
          BUNDLE_VERSION: ${{ inputs.bundle_version }}
          PLATFORMS: ${{ steps.platforms.outputs.platforms }}
          PREVIOUS_RELEASE_VERSION: ${{ inputs.previous_release_version }}
          FIRST_PUBLISH: ${{ inputs.first_publish }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -eo pipefail
          args=()
          if [ "$FIRST_PUBLISH" == "true" ]; then
            if [ -n "$PREVIOUS_RELEASE_VERSION" ]; then
              echo "first_publish and previous_release_version cannot both be set"
              exit 1
            fi
            # An empty previous version tells the bundler there is no earlier
            # release to look up or compare against.
            args+=("--previous-version=")
          elif [ -n "$PREVIOUS_RELEASE_VERSION" ]; then
            args+=("--previous-version=$PREVIOUS_RELEASE_VERSION")
          fi
          if [ "$DRY_RUN" == "true" ]; then args+=("--dry-run"); fi
          python ./bundler.py \
            --version="$NODOS_VERSION" \
            --bundle-key="$BUNDLE_KEY" \
            --bundle-version="$BUNDLE_VERSION" \
            --platforms="$PLATFORMS" \
            "${args[@]}"
        working-directory: ./bundler-${{ github.ref_name }}
      - name: Upload Manifests and Release Notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-manifests-${{ steps.build-number.outputs.build_number }}
          path: ./bundler-${{ github.ref_name }}/Artifacts/
      - name: List Published Releases
        id: published
        # A dry run publishes nothing, so there is no bundle on the store to archive.
        if: inputs.dry_run == false
        shell: bash
        run: |
          python - <<'EOF'
          import json, os
          # An archive can only be built on a runner of its own platform.
          runner_labels = {
              "x86_64-windows": ["Windows", "X64"],
              "x86_64-linux": ["Linux", "X64"],
              "aarch64-linux": ["Linux", "ARM64"],
              "aarch64-macos": ["macOS", "ARM64"],
          }
          with open("Artifacts/releases.json") as f:
              published = json.load(f)
          include = [dict(release, package=published["package"],
                          runner=["self-hosted", "bundler", *runner_labels[release["platform"]]])
                     for release in published["releases"]]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': include})}\n")
          EOF
        working-directory: ./bundler-${{ github.ref_name }}

  archive:
    name: Archive and Release (${{ matrix.platform }})
    needs: release
    if: needs.release.outputs.matrix != ''
    strategy:
      matrix: ${{ fromJson(needs.release.outputs.matrix) }}
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # Required for creating releases
    env:
      GH_TOKEN: ${{ secrets.CI_TOKEN }}
      PACKAGE: ${{ matrix.package }}
      VERSION: ${{ matrix.version }}
      RELEASE_NAME: ${{ matrix.name }}
      PLATFORM: ${{ matrix.platform }}
      BUILD_NUMBER: ${{ needs.release.outputs.build_number }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: nodos-dev/bundler
          ref: ${{ github.ref }}
          path: ./bundler-${{ github.ref_name }}
          fetch-depth: 01
      - name: Install Nosman
        shell: bash
        run: cargo install nosman
        working-directory: ./bundler-${{ github.ref_name }}
      - name: Download Release Notes
        uses: actions/download-artifact@v4
        with:
          name: bundle-manifests-${{ needs.release.outputs.build_number }}
          path: ./bundler-${{ github.ref_name }}/Manifests/
      - name: Build Archive
        id: archive
        # Built from the bundle just published, so the archive holds exactly what the
        # store has.
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Artifacts
          mkdir Artifacts
          nosman bundle --bundle "$PACKAGE:$VERSION" --out "Artifacts/Nodos-$RELEASE_NAME" --archive --clean -y
          if [ "${{ runner.os }}" == "Windows" ]; then extension=zip; else extension=tar.gz; fi
          echo "path=Artifacts/Nodos-$RELEASE_NAME.$extension" >> $GITHUB_OUTPUT
        working-directory: ./bundler-${{ github.ref_name }}
      - name: Copy Archive to Distribution Machine
        shell: pwsh
        env:
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
        run: |
          $target = Join-Path $env:NOS_BUILD_DIR "Bundler" $env:BUILD_NUMBER
          New-Item -ItemType Directory -Force -Path $target
          Copy-Item $env:ARCHIVE_PATH $target
        working-directory: ./bundler-${{ github.ref_name }}
      - name: Create Release
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
        run: |
          gh release create "v$RELEASE_NAME" "$ARCHIVE_PATH" \
            --title "v$RELEASE_NAME" \
            --notes-file "Manifests/release-notes-$PLATFORM.md" \
            --target "${{ github.ref_name }}" \
            --repo nodos-dev/bundler
        working-directory: ./bundler-${{ github.ref_name }}
