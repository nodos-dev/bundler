bundles:
- name: minimal
  version: 0
  nodos: 1.4
  bundled_packages:
    nos.transfer: 0.1.0
    nos.sys.variables: 3.0.0
    nos.reflect: 3.0.0
  engine_index_url: https://store.nodos.dev/api/v1/index/nodos.engine
  plugin_index_urls:
  - url: https://store.nodos.dev/api/v1/index
    name: nodos
    is_active: true

- name: standard
  version: 0
  includes:
  - minimal
  bundled_packages:
    nos.sys.shaderc: 2.1
    nos.sys.vulkan: 8.0
    nos.audio: 1.0
    nos.sys.settings: 3.0
    nos.filters: 3.0
    nos.math: 2.0
    nos.utilities: 4.0
    nos.filesystem: 1.0
    nos.mediaio: 4.0
    nos.flow: 1.0
    nos.compositing: 1.0
    nos.imageprocessing: 1.0
    nos.resource: 1.0
    nos.webcam: 3.0
    nos.sys.animation: 3.0
    nos.animation: 1.0
    nos.webrtc: 2.0
    nos.str: 1.0
    nos.sys.device: 2.0
    nos.rive:
      x86_64-windows: 1.0
      x86_64-linux: 0.3
    nos.sync: 11.1
    nos.sample.dxapp:
      version: 1.1
      type: sample

- name: broadcast
  version: 0
  includes:
  - standard
  nodos: 1.4
  bundled_packages:
    nos.aja: 4.0
    nos.sys.decklink: 4.0
    nos.decklink: 3.0
    nos.track: 3.0
    nos.display: 1.0
    nos.ndi: 2.2
