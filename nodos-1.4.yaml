bundles:
- name: minimal
  version: 0
  nodos:
    x86_64-windows: 1.4
    x86_64-linux: 1.4
  bundled_packages:
    nos.transfer:
      x86_64-windows: 0.1.0
      x86_64-linux: 0.1.0
    nos.sys.variables:
      x86_64-windows: 3.0.0
      x86_64-linux: 3.0.0
    nos.reflect:
      x86_64-windows: 3.0.0
      x86_64-linux: 3.0.0
  engine_index_url: https://store.nodos.dev/api/v1/index/nodos.engine
  plugin_index_urls:
  - url: https://store.nodos.dev/api/v1/index
    name: nodos
    is_active: true

